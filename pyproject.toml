[project]
name = "my-sales"
version = "2.0.0"
description = "My Sales — retail POS, billing, masters and reports (FastAPI)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy==2.0.40",
    "jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.20",
    "segno==1.6.6",
    "requests==2.32.3",
    "psycopg[binary]==3.2.6",
]

[tool.vercel]
entrypoint = "index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
